plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// —— 固定 Release 签名配置 ——
// 密钥库入库（android/keystore/relaygo-release.jks），随仓库保留，环境重置后
// 签名指纹恒定，保证升级可覆盖安装。密码从 keystore.properties 读取
// （该文件已在 .gitignore 中，不入库）；缺文件时回退 debug 签名以便本地开发。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def String releaseStoreFile = keystoreProperties['RELEASE_STORE_FILE']
def String releaseStorePassword = keystoreProperties['RELEASE_STORE_PASSWORD']
def String releaseKeyAlias = keystoreProperties['RELEASE_KEY_ALIAS']
def String releaseKeyPassword = keystoreProperties['RELEASE_KEY_PASSWORD']
def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace "com.relaygo.app"
    compileSdkVersion 36
    // 固定使用本地已完整安装的 NDK 版本（jni 插件要求 28.x）
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.relaygo.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // 强制对原生库 .so 走 legacy Deflate 压缩，使 fat APK 体积从 ~57MB 回到 ~23MB。
    // （minSdk 被依赖库抬到 24，无法用 minSdk<23 触发压缩，故显式开启 useLegacyPackaging）
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        // 固定 Release 签名：密钥随仓库保留，环境重置不改变指纹。
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        } else {
            // keystore.properties 缺失（本地开发/GitHub 克隆）时回退 debug 签名
            release {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            // 用固定的 Release 签名（缺失则回退 debug），保证升级可覆盖安装。
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}
